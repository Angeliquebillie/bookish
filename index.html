<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#572b40"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>BOOKISH — Ma bibliothèque</title>
<style>
:root{--wine:#572b40;--wine2:#79465c;--pink:#e8cbd4;--cream:#faf4ed;--gold:#b18b55;--ink:#30242b;--muted:#82747b;--line:#eadfe3;--paper:#fffdfb}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px system-ui,-apple-system,sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#482337,#805268);color:white;padding:22px 18px 20px;border-radius:0 0 24px 24px}
.kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.8}h1{font:34px Georgia;margin:5px 0}.tagline{font:italic 14px Georgia;opacity:.9}
.wrap{padding:16px;max-width:760px;margin:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:-2px}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:12px 6px;text-align:center;box-shadow:0 3px 12px #4325380a}.stat b{display:block;font:25px Georgia;color:var(--wine)}.stat span{font-size:10px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:space-around;gap:2px;background:#fffdfbf2;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;color:var(--muted);font-size:10px;padding:5px 3px;min-width:0;flex:1}nav button span{display:block;font-size:19px;margin-bottom:2px}nav button.active{color:var(--wine);font-weight:700}
h2{font:25px Georgia;margin:18px 0 12px}h3{font:18px Georgia;margin:0 0 8px}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:14px;margin:12px 0}.muted{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--wine);color:white;font-weight:650;font-size:13px}.btn.light{background:#f2e8ec;color:var(--wine)}.btn.gold{background:var(--gold)}.btn.small{padding:8px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.book{min-width:0}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px 11px 11px 6px;background:linear-gradient(145deg,#67384e,#c99eae);box-shadow:3px 5px 9px #0002}.placeholder{display:flex;align-items:center;justify-content:center;text-align:center;color:white;padding:9px;font:15px Georgia}.booktitle{font:14px Georgia;line-height:1.2;margin-top:6px}.author{font-size:11px;color:var(--muted);margin-top:3px}.chip{display:inline-block;background:#f0e2e7;color:#693c51;border-radius:20px;padding:4px 8px;font-size:10px;margin-top:5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px;font:14px system-ui;color:var(--ink)}label{display:block;font-size:11px;color:var(--muted);margin:10px 0 5px}textarea{min-height:75px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}
.listitem{display:flex;gap:11px;align-items:center;margin:12px 0}.mini{width:47px;height:67px;object-fit:cover;border-radius:5px;background:#cbaab7}.grow{flex:1;min-width:0}.listitem strong{font:15px Georgia}.listitem small{display:block;color:var(--muted);font-size:11px}.bar{height:6px;background:#eee4e8;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#a66e85}.empty{text-align:center;padding:25px 12px;border:1px dashed #d9c6ce;border-radius:15px;color:var(--muted);font-size:13px}
.quote{font:italic 16px Georgia;color:var(--wine);padding:8px 0}.hidden{display:none!important}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding:20px}}
</style></head>
<body>
<header><div class="kicker">Ton univers littéraire</div><h1>BOOKISH ✦</h1><div class="tagline">Des histoires à vivre, des livres à collectionner.</div></header>
<div class="wrap">
<section class="stats"><div class="stat"><b id="total">0</b><span>Bibliothèque</span></div><div class="stat"><b id="done">0</b><span>Terminés</span></div><div class="stat"><b id="reading">0</b><span>En cours</span></div></section>
<main id="view"></main>
</div>
<nav id="nav">
<button class="active" data-page="home"><span>⌂</span>Accueil</button><button data-page="library"><span>▤</span>Livres</button><button data-page="pal"><span>♡</span>PAL</button><button data-page="wishlist"><span>✧</span>Envies</button><button data-page="more"><span>✦</span>Plus</button>
</nav>
<script src="app.js"></script>
</body></html>
